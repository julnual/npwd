name: Publish wedding to GitHub Pages

# Manual until the existing Apps Script deployment has been updated to v2.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:pages
      - run: npm run build:pages
      - name: Require the updated receiver before publishing
        run: node github-pages/check-receiver.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
